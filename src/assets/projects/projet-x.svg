<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Projet X cover placeholder</title>
  <desc id="desc">Local placeholder image for Projet X project card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11263A"/>
      <stop offset="100%" stop-color="#365E7C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g opacity="0.18">
    <circle cx="1350" cy="160" r="220" fill="#ffffff"/>
    <circle cx="240" cy="860" r="280" fill="#ffffff"/>
  </g>
  <text x="90" y="770" fill="#ffffff" font-family="Outfit, Arial, sans-serif" font-size="52" letter-spacing="4">PROJECT COVER</text>
  <text x="90" y="860" fill="#ffffff" font-family="Syne, Arial, sans-serif" font-size="120" font-weight="700">Projet X</text>
</svg>
